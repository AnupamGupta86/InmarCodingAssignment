# Lint, type check, security scans, tests on Linux and macOS, and coverage, on every push.
# The weekly run re-scans the code and the dev tools for newly published vulnerabilities.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: Lint, security rules, type check, dependency audit
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: atm-dispenser}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.14.8"}
      - run: pip install -r requirements-dev.txt
      - name: Lint and security rules (ruff, includes the Bandit rule set)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements-dev.txt

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to publish results in the repository's Security tab
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with: {output: codeql-results}
      - name: Fail the build on any CodeQL finding
        # The analysis only uploads its findings to the Security tab; this step makes them blocking.
        run: |
          python3 - <<'PY'
          import glob, json, sys
          findings = [result["message"]["text"]
                      for path in glob.glob("codeql-results/*.sarif")
                      for run in json.load(open(path))["runs"]
                      for result in run.get("results", [])]
          print(f"CodeQL findings: {len(findings)}")
          for text in findings:
              print("  -", text)
          sys.exit(1 if findings else 0)
          PY

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: atm-dispenser}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # on Windows, use WSL
        python-version: ["3.14.8"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Unit, concurrency, property and CLI tests
        run: python3 -m unittest discover -v
      - name: CLI - example from the brief
        run: python3 src/cli.py --inventory "500:8, 200:10, 100:20" 2700
      - name: Concurrent withdrawals from several processes never pay the same notes
        run: ../scripts/test-concurrent-withdrawals.sh

  coverage:
    name: Coverage (minimum 70%)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: atm-dispenser}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.14.8"}
      - run: pip install -r requirements-dev.txt
      - run: coverage run -m unittest discover
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v6
        with: {name: coverage, path: atm-dispenser/coverage.xml}
