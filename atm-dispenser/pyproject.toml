[project]
name = "atm-dispenser"
version = "1.0.0"
description = "ATM cash dispenser: minimum-notes allocation with limited inventory"
requires-python = ">=3.8"
dependencies = []

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "S", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S310", "S311"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']
