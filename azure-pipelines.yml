# Same checks as .github/workflows/ci.yml.
trigger:
  branches:
    include: ["*"]

pr:
  branches:
    include: ["*"]

variables:
  PYTHONIOENCODING: utf-8

stages:
  - stage: Quality
    displayName: Lint, security rules, type check, dependency audit
    jobs:
      - job: Quality
        pool: {vmImage: ubuntu-latest}
        steps:
          - task: UsePythonVersion@0
            inputs: {versionSpec: "3.14.8"}
          - script: pip install -r requirements-dev.txt
            workingDirectory: atm-dispenser
            displayName: Install dev tools
          - script: ruff check .
            workingDirectory: atm-dispenser
            displayName: Lint and security rules (ruff)
          - script: mypy
            workingDirectory: atm-dispenser
            displayName: Type check (mypy)
          - script: pip-audit -r requirements-dev.txt
            workingDirectory: atm-dispenser
            displayName: Dependency audit (pip-audit)
          - script: |
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
                | tar -xz gitleaks
              ./gitleaks detect --source . --redact --verbose
            displayName: Secret scan (gitleaks)

  - stage: Test
    dependsOn: []
    jobs:
      - job: UnitTests
        strategy:
          matrix:
            Linux: {imageName: ubuntu-latest, pythonVersion: "3.14.8"}
            Mac:   {imageName: macOS-latest,  pythonVersion: "3.14.8"}
        pool: {vmImage: $(imageName)}
        steps:
          - task: UsePythonVersion@0
            inputs: {versionSpec: $(pythonVersion)}
          - script: python3 -m unittest discover -v
            workingDirectory: atm-dispenser
            displayName: Unit, concurrency, property and CLI tests
          - script: python3 src/cli.py --inventory "500:8, 200:10, 100:20" 2700
            workingDirectory: atm-dispenser
            displayName: CLI - example from the brief
          - script: ./scripts/shared-inventory-test.sh
            displayName: Several processes sharing one inventory file never pay the same notes
      - job: Coverage
        pool: {vmImage: ubuntu-latest}
        steps:
          - task: UsePythonVersion@0
            inputs: {versionSpec: "3.14.8"}
          - script: |
              pip install -r requirements-dev.txt
              coverage run -m unittest discover
              coverage report
              coverage xml
            workingDirectory: atm-dispenser
            displayName: Coverage (minimum 70%)
          - task: PublishCodeCoverageResults@2
            inputs: {summaryFileLocation: atm-dispenser/coverage.xml}
