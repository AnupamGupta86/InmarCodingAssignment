services:
  atm:
    build: .
    image: atm-dispenser:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ATM_INVENTORY: "500:8, 200:10, 100:20"
      ATM_MAX_WITHDRAWAL: "200000"
      ATM_API_KEY: ${ATM_API_KEY:-}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
